ss="fas fa-angle-right post-meta-separator"></i><i class="fas fa-inbox fa-fw post-meta-icon"></i><a class="post-meta-categories" href="/categories/%E5%AD%A6%E4%B9%A0/coding/java/">java</a><i class="fas fa-angle-right post-meta-separator"></i><i class="fas fa-inbox fa-fw post-meta-icon"></i><a class="post-meta-categories" href="/categories/%E5%AD%A6%E4%B9%A0/coding/java/%E7%BC%96%E7%A0%81/">编码</a><i class="fas fa-angle-right post-meta-separator"></i><i class="fas fa-inbox fa-fw post-meta-icon"></i><a class="post-meta-categories" href="/categories/%E5%AD%A6%E4%B9%A0/coding/java/%E7%BC%96%E7%A0%81/mini-spring/">mini-spring</a></span></div><div class="meta-secondline"></div></div></div></header><main class="layout" id="content-inner"><div id="post"><article class="container post-content" id="article-container"><h1 id="前言"><a href="#前言" class="headerlink" title="前言"></a>前言</h1><p>这次 coding 很吃力，两天才敲完，当然有我拖延的原因 🤣 但是还得吐槽一句这个 bugstack 的文章写的太 💩 了。他仅仅是把一些核心的改动讲解一下，而且讲解的大多停留在功能逻辑的介绍上，却忽略对于类或接口的设计，而且经常会新增或者修改一些类或者接口的实现，这导致我再把实现的过程中必须时常去翻他的源码对照着敲，不仅费时费力，而且常常让我对这些莫名其妙的修改而困惑。总之，这人的文章质量不是很高。</p>
<h1 id="背景"><a href="#背景" class="headerlink" title="背景"></a>背景</h1><p>这次的更新是针对两点</p>
<ul>
<li>提供可由开发者自定义的对于 Bean 的扩展接口，以便让开发者能够在不同的时机，例如：BeanDefinition 加载后，Bean 属性注入之后或者是 Bean 的 init 方法执行前后去执行一些自定义的逻辑（修改 BeanDefinition&#x2F;Bean 亦或是执行一些如前置校验的逻辑）。</li>
<li>预实例化：仿照 spring 的做法在传入配置路径的就提前将所有的 Bean 加载到内存中（提前检查错误，加快程序响应）</li>
</ul>
<p>如果要达成第一点，要解决的问题是：要想在这些 <strong>时机</strong> 实现自定义逻辑 ，必然需要将这些时机抽象出来并编排成一个标准化的流程（由若干个函数组成），并在这个流程的各个时机插入一些特殊处理的接口。而要达到第二点必须在第一点的基础上，将预实例化加入这个 sop 中，传入配置路径后便可达到目的。直接实现但是问题是原本的 BeanFactory 仅仅负责 BeanDefinition 以及 Bean 的存储以及单个 Bean 的实例化操作，而且之前的 Bean 都是只有在 <code>getBean</code> 后才会去加载，是被动地、懒加载的。<strong>为了实现流程的统一编排</strong>，我们必须抽象出一个更高层的类&#x2F;接口来完成这一个工作。也就自然而然地引出了 <strong><code>ApplicationContext</code></strong></p>
